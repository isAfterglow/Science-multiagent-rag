<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MOOSE Research Copilot</title>
  <style>
    :root{--ink:#16212b;--muted:#5f6f7d;--line:#d7e0e7;--page:#f5f7f8;--panel:#fff;--navy:#123047;--blue:#056b91;--teal:#08766e;--red:#b42318;--amber:#985b09;--a:#0b6e4f;--b:#255e9e;--c:#6b4da3;--d:#a14f13}*{box-sizing:border-box}body{margin:0;background:var(--page);font:14px/1.5 Arial,sans-serif;color:var(--ink)}header{height:58px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 28px;gap:14px}header strong{font-size:17px}header span{color:#c8d5df;font-size:13px}.shell{max-width:1440px;margin:20px auto;padding:0 20px}.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,.8fr);gap:18px}.panel{background:var(--panel);border:1px solid var(--line);padding:18px}.panel h2{font-size:15px;margin:0 0 12px}.panel h3{font-size:12px;margin:20px 0 7px;color:var(--muted);text-transform:uppercase;letter-spacing:0}.command{display:flex;gap:8px;align-items:flex-start}textarea,input,select{width:100%;border:1px solid #b8c5ce;padding:9px;font:inherit;background:#fff;color:var(--ink)}textarea{min-height:86px;resize:vertical}button{border:0;background:var(--blue);color:#fff;padding:9px 12px;font:inherit;cursor:pointer;white-space:nowrap}button.secondary{background:var(--teal)}button.warning{background:var(--amber)}button:disabled{opacity:.55;cursor:not-allowed}.answer{background:#f1f7f7;border-left:3px solid var(--teal);padding:12px;white-space:pre-wrap;max-height:280px;overflow:auto}.flow{display:flex;align-items:center;gap:5px;overflow:auto;padding:3px 0}.node{border:1px solid #9bc6d5;color:#075985;background:#f0f9ff;padding:4px 7px;font-size:12px;white-space:nowrap}.arrow{color:#8a9aa8}.meta{color:var(--muted);font-size:12px}.evidence{border-top:1px solid var(--line);padding:12px 0}.evidence:first-child{border-top:0}.source{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.badge{font-size:11px;border:1px solid currentColor;padding:1px 5px}.A{color:var(--a)}.B{color:var(--b)}.C{color:var(--c)}.D{color:var(--d)}.excerpt{margin-top:6px;color:#334553;font-size:13px}.table-preview{margin:7px 0 0;max-height:155px;overflow:auto;padding:8px;background:#f7f9fb;border-left:2px solid var(--blue);font:11px/1.4 monospace;white-space:pre-wrap}.scan-link{display:inline-block;margin-top:6px;color:var(--blue);text-decoration:none}.review-ok{color:var(--a)}.review-stop{color:var(--red)}.plan{border-top:1px solid var(--line);padding:12px 0}.status{font-size:11px;padding:2px 5px;border:1px solid var(--line);color:var(--muted)}.approved{color:var(--a);border-color:#6ee7b7}.pending{color:var(--amber);border-color:#f4c66c}.tight{display:grid;grid-template-columns:1fr 86px;gap:8px}.plot img{width:100%;margin-top:8px;border:1px solid var(--line)}@media(max-width:900px){.grid{grid-template-columns:1fr}.shell{padding:0 12px}.command{display:block}.command button{margin-top:8px}}
  </style>
</head>
<body>
  <header><strong>MOOSE Research Copilot</strong><span>证据约束的多智能体仿真研究工作台</span></header>
  <main class="shell"><div class="grid">
    <section class="panel">
      <h2>研究任务</h2>
      <div class="command"><textarea id="question">cpv_front_scale 对 early_1_2_rmse 有何影响，并说明历史报告依据</textarea><div><button onclick="research()">运行分析</button><button class="secondary" onclick="submitTask()">后台提交</button></div></div>
      <h3>节点流转</h3><div class="flow" id="trace"><span class="meta">等待任务。</span></div>
      <h3>审核后的结论</h3><div class="answer" id="answer">等待分析。</div>
      <h3>证据需求</h3><div id="requirements" class="meta">等待路由。</div>
      <h3>证据链</h3><div id="citations" class="meta">等待检索。</div>
      <h3>审核与知识缺口</h3><div id="review" class="meta">等待审核。</div><div id="gap" class="meta" style="margin-top:6px"></div>
    </section>
    <aside class="panel">
      <h2>受控实验</h2>
      <div class="tight"><select id="metric"><option>early_1_2_rmse</option><option>temp_mean_rmse</option></select><input id="count" type="number" min="1" max="5" value="1"></div>
      <button class="secondary" onclick="createPlan()">生成待审批计划</button>
      <h3>研究草案</h3><div id="draft" class="meta">等待任务提出草案。</div>
      <h3>审批与执行</h3><div id="plans" class="meta">正在加载计划。</div>
      <h3>后台任务</h3><div id="tasks" class="meta">正在加载任务。</div>
      <h3>资源队列</h3><div id="resources" class="meta">正在加载资源状态。</div>
      <h3>文档解析</h3><div id="docir" class="meta">正在加载解析摘要。</div>
      <h3>科研绘图</h3><button onclick="drawCorrelation()">相关性</button><button class="secondary" onclick="drawRanking()">排名</button><div class="plot meta" id="plot">等待生成图表。</div>
    </aside>
  </div></main>
<script>
const q=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(path,opt={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw Error((await r.json()).detail||r.statusText);return r.json()}
function renderFlow(events){const names=[];for(const event of events||[]){if(event.node&&!names.includes(event.node))names.push(event.node)}q('#trace').innerHTML=names.map((name,i)=>`${i?'<span class="arrow">›</span>':''}<span class="node">${esc(name)}</span>`).join('')||'<span class="meta">未生成节点事件。</span>'}
function card(c){const r=c.retrieval||{},auth=r.authority||'?',title=r.title||c.source_path.split('/').pop(),page=r.page?`第 ${r.page} 页`:`行 ${r.start_line??'-'}-${r.end_line??'-'}`,ocr=r.ocr_used?` · OCR ${Number(r.ocr_confidence||0).toFixed(2)}`:'',kind=r.block_type?` · ${r.block_type}`:'',section=r.section?`<div class="meta">章节：${esc(r.section)} · bbox：${esc(JSON.stringify(r.bboxes||[]).slice(0,130))}</div>`:'',table=r.block_type==='table'?`<div class="meta">表格结构置信度：${Number(r.table_confidence||0).toFixed(2)}</div><pre class="table-preview">${esc((r.table_csv||c.excerpt).slice(0,900))}</pre>`:'';const image=r.page_image?`<a class="scan-link" target="_blank" href="/knowledge-pages/${encodeURIComponent(r.page_image.split('/').pop())}">查看原始扫描页</a>`:'';return `<article class="evidence"><div class="source"><span class="badge ${esc(auth)}">${esc(auth)} 级</span><b>${esc(title)}</b><span class="meta">${esc(c.source_type)} · ${esc(page)}${esc(kind)}${esc(ocr)}</span></div>${section}<div class="excerpt">${esc(c.excerpt.slice(0,300))}</div>${table}${image}</article>`}
function renderResearch(d){q('#answer').textContent=d.answer||'Reviewer 未生成可展示结论。';renderFlow(d.trace);q('#requirements').innerHTML=(d.evidence_requirements||[]).map(x=>`<span class="node">${esc(x.kind)}</span> ${esc(x.reason)}`).join('<br>')||'无需文档证据。';q('#citations').innerHTML=(d.evidence_cards||[]).map(card).join('')||'未检索到文档证据。';const ok=d.review?.approved;const reasons=(d.review?.reasons||[]).map(esc).join('；');q('#review').innerHTML=`<b class="${ok?'review-ok':'review-stop'}">${ok?'Reviewer 已通过':'Reviewer 未通过'}</b>${reasons?`：${reasons}`:''}`;q('#gap').textContent=d.evidence_gap?.message||'本次无需要新仿真的知识缺口。';const p=d.plan_draft||{};q('#draft').innerHTML=p.plan_id?`<b>${esc(p.plan_id)}</b><div>${esc(p.rationale)}</div><button class="warning" onclick="confirmDraft()">确认写入待审批</button>`:'本次没有建议草案。';window.activeDraft=p}
async function research(){q('#answer').textContent='分析中...';q('#trace').innerHTML='<span class="node">accepted</span>';q('#citations').textContent='检索中...';try{const r=await fetch('/research/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q('#question').value})});if(!r.ok)throw Error(r.statusText);const reader=r.body.getReader();let buf='',done=false;const events=[];while(!done){const x=await reader.read();done=x.done;buf+=new TextDecoder().decode(x.value||new Uint8Array);const parts=buf.split('\n\n');buf=parts.pop();for(const part of parts){const type=(part.match(/event: (.*)/)||[])[1],data=(part.match(/data: (.*)/)||[])[1];if(!data)continue;const item=JSON.parse(data);if(type==='node'){events.push(item);renderFlow(events)}if(type==='result')renderResearch(item)}}}catch(e){q('#answer').textContent='错误：'+e.message}}
async function submitTask(){try{const d=await api('/research/tasks',{method:'POST',body:JSON.stringify({question:q('#question').value})});q('#answer').textContent=`后台任务已提交：${d.task_id}`;loadTasks()}catch(e){q('#answer').textContent='错误：'+e.message}}
async function confirmDraft(){if(!window.activeDraft?.plan_id)return;try{await api('/plans/drafts/confirm',{method:'POST',body:JSON.stringify({plan:window.activeDraft})});q('#draft').textContent='草案已写入 pending，等待人工审批。';loadPlans()}catch(e){q('#draft').textContent='写入失败：'+e.message}}
async function createPlan(){try{await api('/plans',{method:'POST',body:JSON.stringify({target_metric:q('#metric').value,n_cases:+q('#count').value})});loadPlans()}catch(e){alert(e.message)}}
async function decide(id,action){const comment=action==='rejected'?(prompt('拒绝原因（将持久化记录）','需要补充参数依据')??null):'网页审批';if(comment===null)return;try{await api(`/plans/${id}/${action==='approved'?'approve':'reject'}`,{method:'POST',body:JSON.stringify({actor:'workbench-reviewer',comment})});loadPlans()}catch(e){alert(e.message)}}
async function preview(id){try{const d=await api(`/plans/${id}/execute`,{method:'POST'});alert(`预览完成：${d.preview_cases} 个 case，未启动 MOOSE。`);loadPlans()}catch(e){alert(e.message)}}
async function loadPlans(){try{const rows=await api('/plans');q('#plans').innerHTML=rows.map(p=>`<div class="plan"><b>${esc(p.plan_id)}</b> <span class="status ${esc(p.status)}">${esc(p.status)}</span><div class="meta">${esc(p.plan.target_metric)} · ${p.plan.cases.length} case · 预计 ${p.plan.estimated_seconds}s</div>${p.decision_comment?`<div class="meta">审批意见：${esc(p.decision_comment)}</div>`:''}${p.result.conclusion?`<div class="meta">执行记录：${esc(p.result.conclusion)}</div>`:''}${p.status==='pending'?`<button onclick="decide('${p.plan_id}','approved')">批准</button><button class="warning" onclick="decide('${p.plan_id}','rejected')">拒绝</button>`:''}${p.status==='approved'?`<button class="secondary" onclick="preview('${p.plan_id}')">隔离预览</button>`:''}</div>`).join('')||'暂无计划。'}catch(e){q('#plans').textContent='加载失败：'+e.message}}
async function loadTasks(){try{const rows=await api('/research/tasks');q('#tasks').innerHTML=rows.slice(0,5).map(t=>`<div class="plan"><b>${esc(t.task_id)}</b> <span class="status">${esc(t.status)}</span><div>${esc(t.question.slice(0,70))}</div><div class="meta">${t.latency_ms??'-'}ms</div></div>`).join('')||'暂无任务。'}catch(e){q('#tasks').textContent='加载失败：'+e.message}}
async function loadResources(){try{const d=await api('/observability'),queue=Object.entries(d.model_resources).map(([k,v])=>`<div>${esc(k)}：active ${v.active} · 平均等待 ${v.mean_wait_ms}ms</div>`).join(''),index=d.vector_index||{};q('#resources').innerHTML=`${queue}<div>向量索引：${esc(index.backend||'?')} · ${esc(index.status||'?')} · ${esc(index.collection||index.index_root||'')}</div>${index.count!==undefined?`<div>向量数：${esc(index.count)}</div>`:''}${index.error?`<div>后端原因：${esc(index.error)}</div>`:''}` }catch(e){q('#resources').textContent='加载失败：'+e.message}}
async function loadDocumentIR(){try{const d=await api('/knowledge/summary');q('#docir').innerHTML=d.status?esc(d.status):`来源 ${d.sources} · 页面 ${d.pages} · blocks ${d.blocks}<br>双栏页 ${d.two_column_pages} · 表格 ${d.tables}（高置信 ${d.high_confidence_tables}） · OCR ${d.ocr_blocks}` }catch(e){q('#docir').textContent='加载失败：'+e.message}}
async function drawCorrelation(){q('#plot').textContent='生成中...';try{showPlot(await api('/plots/correlation',{method:'POST',body:JSON.stringify({target_metric:q('#metric').value,n_cases:+q('#count').value})}))}catch(e){q('#plot').textContent='生成失败：'+e.message}}
async function drawRanking(){q('#plot').textContent='生成中...';try{showPlot(await api('/plots/ranking',{method:'POST',body:JSON.stringify({target_metric:q('#metric').value,n_cases:+q('#count').value})}))}catch(e){q('#plot').textContent='生成失败：'+e.message}}
function showPlot(d){const name=d.image_path.split('/').pop();q('#plot').innerHTML=`<div>${esc(d.chart_type)} · ${d.sample_size} 条历史样本</div><img src="/artifacts/${encodeURIComponent(name)}" alt="${esc(d.chart_type)}"><div>${esc((d.limitations||[]).join(' '))}</div>`}loadPlans();loadTasks();loadResources();loadDocumentIR();setInterval(()=>{loadTasks();loadResources()},3000);
</script></body></html>
