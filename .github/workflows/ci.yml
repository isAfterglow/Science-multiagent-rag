name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    env:
      MOOSE_COPILOT_LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app eval tests
      - run: >-
          pytest -q
          tests/test_trace_contract.py
          tests/test_recovery_loop.py
          tests/test_llm_agent_collaboration.py
          tests/test_task_manager.py
          tests/test_stage1.py
      # Public runners have neither the private MOOSE workspace nor local models.
      # Validate the versioned gate contract here; run real corpus regression below.
      - run: >-
          python -m eval.regression_gate
          --workflow reports/multi_agent_collaboration_eval_deterministic.json
          --safety reports/scientific_safety_eval.json
